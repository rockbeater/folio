# Folio with Docker Compose (see README.md for the step-by-step guide).
# Settings are read from the .env file next to this file (copy .env.example to .env).
services:
  folio:
    image: ghcr.io/rockbeater/folio:latest
    container_name: folio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Left side: the port on your server. Change it if 8080 is already in use.
      - "8080:8080"
    volumes:
      # Your photo folder: one folder per gallery, one subfolder per section.
      - /path/to/photos:/photos
      # Database and settings. Back this up.
      - ./data:/data
      # Thumbnails. Can be deleted at any time; Folio makes them again.
      - ./cache:/cache
